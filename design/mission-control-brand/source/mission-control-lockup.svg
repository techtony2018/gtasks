<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="326" height="64" viewBox="0 0 326 64" role="img" aria-labelledby="title desc">
  <title id="title">Mission Control</title>
